name: Builder Windows

on:
  push:
    branches: [builder-features]

permissions:
  contents: write

concurrency:
  group: builder-windows-${{ github.ref }}
  # Let the active build finish and save the compiler state for the queued build.
  cancel-in-progress: false

jobs:
  binaries:
    if: github.repository == 'Ahwfr/cinnabar'
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      HEADLESS_TEST: ${{ contains(github.event.head_commit.message, '[headless test]') }}
      CARGO_BUILD_BUILD_DIR: "{workspace-root}/target"
      CARGO_PROFILE_RELEASE_INCREMENTAL: "true"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        if: env.HEADLESS_TEST != 'true'
        with:
          go-version: stable
          cache-dependency-path: |
            go.work.sum
            core/go.sum
            tools/localserver/go.sum
      - name: Set up Rust and Make
        shell: pwsh
        run: |
          rustup toolchain install
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (!(Get-Command make -ErrorAction SilentlyContinue)) {
            choco install make --no-progress -y
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - name: Cache Rust dependencies and incremental build state
        id: rust-cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src/*/*-sys-*
            ~/.cargo/git
            target/.ci-inputs.json
            target/release/.fingerprint
            target/release/build
            target/release/deps/*.rlib
            target/release/deps/*.rmeta
            target/release/deps/*.dll
            target/release/incremental
            target/builder-importer
          key: builder-windows-incremental-v1-${{ hashFiles('rust-toolchain.toml', '.github/workflows/builder-windows.yml') }}-${{ github.sha }}
          restore-keys: |
            builder-windows-incremental-v1-${{ hashFiles('rust-toolchain.toml', '.github/workflows/builder-windows.yml') }}-
            builder-windows-incremental-v1-72e7ad6ea8c0e3ca8b38b1d2f7d16f4edf5319251f539f4aa444f60f6a6bd223-
            builder-windows-incremental-v1-779b123bffca1cfcf7c502ee408aa5315bd12b973206256d5e6aff1888318395-
            builder-windows-incremental-v1-
      - name: Seed the first incremental build from the previous dependency cache
        if: steps.rust-cache.outputs.cache-hit == ''
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/release/.fingerprint
            target/release/build
            target/release/deps/*.rlib
            target/release/deps/*.rmeta
            target/release/deps/*.dll
          key: builder-windows-parallel-v1-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'builder/schematica/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            builder-windows-parallel-v1-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'builder/schematica/Cargo.lock') }}-
      - name: Restore unchanged source timestamps
        shell: pwsh
        run: python .github/actions/build-cache/cache.py restore-inputs
      - name: Build upstream runtime binaries
        if: env.HEADLESS_TEST != 'true'
        shell: bash
        run: make package-binaries
      - name: Build the headless test client and controller
        if: env.HEADLESS_TEST == 'true'
        shell: pwsh
        env:
          CINNABAR_BUILD_COMMIT: ${{ github.sha }}
        run: cargo build --locked --release -p cinnabar -p cinnabar-mcp --features cinnabar/developer-control
      - name: Build the schematic importer
        shell: pwsh
        env:
          CARGO_BUILD_BUILD_DIR: ${{ github.workspace }}/target/builder-importer
        run: ./builder/Build-Builder.ps1 -ImporterOnly
      - name: Verify the cached build inputs
        shell: pwsh
        run: python .github/actions/build-cache/cache.py verify-inputs
      - name: Stage the checkout binaries
        if: env.HEADLESS_TEST != 'true'
        shell: pwsh
        run: |
          $release = 'builder-artifact/runtime'
          New-Item -ItemType Directory -Force -Path $release | Out-Null
          foreach ($line in Get-Content -LiteralPath 'packaging/common/runtime-binaries.txt') {
            $name = ($line -split '\s+')[0]
            Copy-Item -LiteralPath "target/release/$name.exe" -Destination $release
          }
          Copy-Item -LiteralPath 'target/release/assetc.exe' -Destination $release
          ./packaging/windows/fetch-dxc.ps1 -Out $release
          Copy-Item -LiteralPath 'target/builder-importer/release/schematica-builder.exe' -Destination 'builder-artifact/Cinnabar Builder.exe'
          Copy-Item -LiteralPath 'target/builder-importer/wasm32-unknown-unknown/release/schematica_guest.wasm' -Destination 'builder-artifact/schematica-guest-template.bin'
          ./packaging/windows/stage-prep-kit.ps1 -Root $PWD -Kit "$release/resources/prep-kit" -Assetc "$release/assetc.exe"
          Copy-Item -LiteralPath 'LICENSE', 'THIRD_PARTY_NOTICES.md' -Destination 'builder-artifact'
          Copy-Item -LiteralPath 'builder/schematica/SCHEMATICA-LICENSE.txt' -Destination 'builder-artifact'
          Copy-Item -LiteralPath 'assets/licenses' -Destination 'builder-artifact' -Recurse
          Set-Content -LiteralPath 'builder-artifact/builder-commit.txt' -Value $env:GITHUB_SHA -Encoding ASCII
          Copy-Item -LiteralPath 'builder/PORTABLE-README.md' -Destination 'builder-artifact/README.md'
          git archive --format=zip --output=builder-artifact/Builder-Source.zip HEAD
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        if: env.HEADLESS_TEST != 'true'
        with:
          name: cinnabar-builder-windows-x64
          path: builder-artifact/
          if-no-files-found: error
          retention-days: 14
      - name: Publish the versioned Builder release
        if: env.HEADLESS_TEST != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./builder/Publish-BuilderRelease.ps1 -PackageDirectory builder-artifact -Publish
      - name: Stage the headless test binaries
        if: env.HEADLESS_TEST == 'true'
        shell: pwsh
        run: |
          $out = 'headless-test-artifact'
          $wasm = 'target/builder-importer/wasm32-unknown-unknown/release/schematica_guest.wasm'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item -LiteralPath 'target/release/cinnabar.exe', 'target/release/cinnabar-mcp.exe', 'target/builder-importer/release/schematica-builder.exe', $wasm -Destination $out
          Set-Content -LiteralPath "$out/builder-commit.txt" -Value $env:GITHUB_SHA -Encoding ASCII
      - uses: actions/upload-artifact@v7
        if: env.HEADLESS_TEST == 'true'
        with:
          name: cinnabar-builder-headless-test-windows-x64
          path: headless-test-artifact/
          if-no-files-found: error
          retention-days: 7
